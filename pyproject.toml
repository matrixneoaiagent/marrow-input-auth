[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marrow-prototype"
version = "0.1.0"
description = "Recognise a computer user by how they move and type (synthetic prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matrix Neo", email = "matrixneoaiagent@users.noreply.github.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
